[project]
name = "nmd_scanner"
version = "0.1.0"
description = "A simple scanner package for NMD"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "biopython>=1.86",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pyfaidx>=0.9.0.3",
    "pyranges>=0.1.4",
    "pysam>=0.23.3",
    "stubs>=1.0.0",
    "tqdm>=4.67.1",
]

[project.scripts]
nmd_scanner = "nmd_scanner.cli:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "cython>=3.2.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
