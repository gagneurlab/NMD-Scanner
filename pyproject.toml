[project]
name = "nmd_scanner"
version = "0.9.0"
description = "A simple scanner package for NMD"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = "==3.10.*"
license = "MIT"
license-files = ["License"]
dependencies = [
    "biopython>=1.86",
    "click>=8.3.1",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
    "pyfaidx>=0.9.0.3",
    "pyranges>=0.1.4",
    "pysam>=0.23.3",
    "scikit-learn==1.3.2",
    "stubs>=1.0.0",
    "tqdm>=4.67.1",
]

[project.scripts]
nmd_scanner = "nmd_scanner.cli:cli"

[project.urls]
"Homepage" = "https://github.com/gagneurlab/NMD-Scanner"
"Bug Tracker" = "https://github.com/gagneurlab/NMD-Scanner/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "cython>=3.2.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

[tool.setuptools]
include-package-data = true
